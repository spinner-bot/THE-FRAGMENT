<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Coda">
  <title>Coda</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1a150d"/>
      <stop offset="0.46" stop-color="#110e09"/>
      <stop offset="1" stop-color="#0c0a07"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4ead6"/>
      <stop offset="0.38" stop-color="#e7d3a8"/>
      <stop offset="0.62" stop-color="#c9a86a"/>
      <stop offset="1" stop-color="#f0e3c8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9a86a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#c9a86a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft40" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0.5" x2="4" y2="0.5" stroke="#ffffff" stroke-opacity="0.018"/>
      <line x1="0" y1="2.5" x2="4" y2="2.5" stroke="#000000" stroke-opacity="0.10"/>
    </pattern>
    <clipPath id="torn"><polygon points="24,44 92,30 170,50 250,28 340,46 430,32 520,52 610,30 700,48 790,34 880,50 970,30 1060,46 1130,32 1176,42 1178,108 1170,184 1176,260 1172,288 1176,286 1130,302 1060,282 970,300 880,280 790,298 700,284 610,302 520,280 430,296 340,282 250,300 170,286 92,298 24,288 28,260 22,184 30,108 24,60"/></clipPath>
  </defs>
  <g clip-path="url(#torn)">
    <rect width="1200" height="330" fill="url(#paper)"/>
    <rect width="1200" height="330" fill="url(#grain)"/>
    <ellipse cx="600" cy="165" rx="380" ry="120" fill="url(#halo)"/>
    <rect x="54" y="58" width="1092" height="214" fill="none" stroke="#c9a86a" stroke-opacity="0.09"/>
    <text x="600" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="36" font-style="italic" fill="#e6d9c2" letter-spacing="0.6">It stays open, and waits.</text>
    <text x="600" y="214" text-anchor="middle" font-family="'Songti SC','STSong','Noto Serif CJK SC','SimSun',serif"
          font-size="29" fill="#a3967d" letter-spacing="6">它始终敞开,并等待。</text>
    <rect x="595" y="256" width="10" height="10" transform="rotate(45 600 261)" fill="none" stroke="#c9a86a" stroke-opacity="0.55"/>
    <text x="600" y="296" text-anchor="middle" font-family="Georgia, serif" font-size="10"
          letter-spacing="6" fill="#c9a86a" opacity="0.32">THE FRAGMENT · 残卷</text>
  </g>
</svg>
