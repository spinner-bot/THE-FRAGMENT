      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;-8 0;0 0;8 0;0 0" dur="27s" repeatCount="indefinite"/>
        <circle cx="205" cy="190" r="1.1" opacity="0.22"/>
        <circle cx="352" cy="128" r="0.9" opacity="0.18"/>
        <circle cx="512" cy="240" r="1.0" opacity="0.20"/>
        <circle cx="742" cy="470" r="1.0" opacity="0.17"/>
        <circle cx="902" cy="360" r="1.5" opacity="0.26"/>
        <circle cx="1052" cy="470" r="1.6" opacity="0.30"/>
        <circle cx="1208" cy="160" r="1.3" opacity="0.24"/>
        <circle cx="1364" cy="240" r="1.0" opacity="0.19"/>
        <circle cx="1510" cy="190" r="0.9" opacity="0.17"/>
        <circle cx="410" cy="60" r="1.0" opacity="0.16"/>
