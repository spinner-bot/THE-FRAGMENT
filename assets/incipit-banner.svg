      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;12 0;0 0;-12 0;0 0" dur="19s" repeatCount="indefinite"/>
        <circle cx="120" cy="300" r="1.6" opacity="0.34"/>
        <circle cx="286" cy="360" r="1.4" opacity="0.26"/>
        <circle cx="438" cy="470" r="1.7" opacity="0.30"/>
        <circle cx="596" cy="140" r="1.3" opacity="0.24"/>
        <circle cx="664" cy="330" r="1.8" opacity="0.28"/>
        <circle cx="820" cy="170" r="1.2" opacity="0.22"/>
        <circle cx="978" cy="220" r="0.9" opacity="0.18"/>
        <circle cx="1130" cy="300" r="1.1" opacity="0.21"/>
        <circle cx="1286" cy="390" r="1.7" opacity="0.29"/>
        <circle cx="1442" cy="330" r="1.4" opacity="0.27"/>
        <circle cx="168" cy="500" r="1.2" opacity="0.20"/>
        <circle cx="960" cy="70" r="1.1" opacity="0.17"/>
      </g>
    </g>
  </g>

  <g fill="#e4c68c">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -560" dur="52s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;-8 0;0 0;8 0;0 0" dur="27s" repeatCount="indefinite"/>
        <circle cx="205" cy="190" r="1.1" opacity="0.22"/>
        <circle cx="352" cy="128" r="0.9" opacity="0.18"/>
        <circle cx="512" cy="240" r="1.0" opacity="0.20"/>
