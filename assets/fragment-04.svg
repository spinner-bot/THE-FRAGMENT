<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 446" width="1200" height="446" role="img" aria-label="Fragment IV">
  <title>Fragment IV</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1a150d"/>
      <stop offset="0.46" stop-color="#110e09"/>
      <stop offset="1" stop-color="#0c0a07"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4ead6"/>
      <stop offset="0.38" stop-color="#e7d3a8"/>
      <stop offset="0.62" stop-color="#c9a86a"/>
      <stop offset="1" stop-color="#f0e3c8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9a86a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#c9a86a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft40" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0.5" x2="4" y2="0.5" stroke="#ffffff" stroke-opacity="0.018"/>
      <line x1="0" y1="2.5" x2="4" y2="2.5" stroke="#000000" stroke-opacity="0.10"/>
    </pattern>
    <clipPath id="torn"><polygon points="24,44 92,30 170,50 250,28 340,46 430,32 520,52 610,30 700,48 790,34 880,50 970,30 1060,46 1130,32 1176,42 1178,147 1170,249 1176,352 1172,404 1176,402 1130,418 1060,398 970,416 880,396 790,414 700,400 610,418 520,396 430,412 340,398 250,416 170,402 92,414 24,404 28,352 22,249 30,147 24,60"/></clipPath>
  </defs>
  <g clip-path="url(#torn)">
    <rect width="1200" height="446" fill="url(#paper)"/>
    <rect width="1200" height="446" fill="url(#grain)"/>
    <ellipse cx="600" cy="150" rx="330" ry="130" fill="url(#halo)"/>
    <ellipse cx="1030" cy="80" rx="120" ry="70" fill="#7a502d" opacity="0.08" filter="url(#soft40)"/>
    <ellipse cx="180" cy="410" rx="110" ry="70" fill="#6e4a2a" opacity="0.08" filter="url(#soft40)"/>
    <line x1="30" y1="316" x2="1170" y2="312" stroke="#000000" stroke-opacity="0.45"/>
    <line x1="30" y1="315" x2="1170" y2="311" stroke="#c9a86a" stroke-opacity="0.07"/>
    <rect x="54" y="64" width="1092" height="318" fill="none" stroke="#c9a86a" stroke-opacity="0.09"/>
    <text x="600" y="106" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="42" letter-spacing="12" fill="url(#gold)" opacity="0.9">IV
      <animate attributeName="opacity" values="0.7;1;0.7" dur="11s" repeatCount="indefinite"/>
    </text>
    <line x1="548" y1="134" x2="652" y2="134" stroke="#c9a86a" stroke-opacity="0.30"/>
    <rect x="595" y="129" width="10" height="10" transform="rotate(45 600 134)" fill="none" stroke="#c9a86a" stroke-opacity="0.55"/>
    <text font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#efe6d4" letter-spacing="0.2" y="206">
    <tspan x="110" dy="0">Three times the page ends before it should. Three times the reader</tspan>
    <tspan x="110" dy="50">is left holding a silence shaped like a hand.</tspan>
    </text>
    <line x1="86" y1="294" x2="86" y2="352" stroke="#c9a86a" stroke-opacity="0.22"/>
    <text font-family="'Songti SC','STSong','Noto Serif CJK SC','SimSun',serif" font-size="28" fill="#b6a88f" letter-spacing="1.4" y="326">
      <tspan x="110" dy="0">页面三次在它本该结束之前结束。读者三次握住的,</tspan>
      <tspan x="110" dy="46">是一个形状像手的沉默。</tspan>
    </text>
    <text x="1136" y="408" text-anchor="end" font-family="Georgia, serif" font-size="10"
          letter-spacing="4" fill="#c9a86a" opacity="0.28">04 / 06</text>
    <circle cx="96" cy="159" r="1.4" fill="#e4c68c" opacity="0.22"/>
    <circle cx="214" cy="139" r="1.0" fill="#e4c68c" opacity="0.16"/>
    <circle cx="352" cy="183" r="1.7" fill="#e4c68c" opacity="0.24"/>
    <circle cx="498" cy="149" r="1.1" fill="#e4c68c" opacity="0.18"/>
    <circle cx="648" cy="173" r="1.5" fill="#e4c68c" opacity="0.21"/>
    <circle cx="792" cy="139" r="1.0" fill="#e4c68c" opacity="0.15"/>
    <circle cx="938" cy="178" r="1.6" fill="#e4c68c" opacity="0.22"/>
    <circle cx="1088" cy="154" r="1.2" fill="#e4c68c" opacity="0.17"/>
    <circle cx="531" cy="396" r="1.6" fill="#e4c68c" opacity="0">
      <animate attributeName="cy" values="396;-20" dur="42s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.28;0.20;0" keyTimes="0;0.1;0.85;1" dur="42s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
